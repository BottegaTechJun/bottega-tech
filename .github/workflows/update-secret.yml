name: Update API Env Var

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Variable to update"
        required: true
        type: choice
        options:
          - CALA_API_KEY
          - VALKEY_URL
          - DATABASE_URL
          - INTERNAL_API_SECRET
          - CORS_ORIGIN
          - GEMINI_API_KEY
          - MATCHUP_MODEL
          - MATCHUP_MAX_STEPS
          - LANGFUSE_PUBLIC_KEY
          - LANGFUSE_SECRET_KEY
          - LANGFUSE_BASE_URL
          - LANGFUSE_PROJECT_ID
      value:
        description: "New value (masked in logs)"
        required: true
        type: string

env:
  PROJECT: sincere-cacao-514419-v5
  REGION: europe-north1
  SERVICE: bottega-api

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Read value from event file, never via ${{ }}, so it is masked before any log line.
      - name: Mask value
        run: |
          value=$(jq -r '.inputs.value' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$value"
          if [ -z "$value" ]; then
            echo "Value is empty" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update env var on Cloud Run
        env:
          NAME: ${{ inputs.name }}
        run: |
          value=$(jq -r '.inputs.value' "$GITHUB_EVENT_PATH")
          # ^@@^ swaps the list delimiter so values with commas stay intact.
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --update-env-vars="^@@^$NAME=$value" --quiet
