name: Update API Secret

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Secret name. Must match a GitHub Actions secret and the env var name."
        required: true
        type: choice
        options:
          - CALA_API_KEY
          - VALKEY_URL
          - DATABASE_URL
          - INTERNAL_API_SECRET
          - GEMINI_API_KEY
          - LANGFUSE_PUBLIC_KEY
          - LANGFUSE_SECRET_KEY
      restart:
        description: "Roll a new Cloud Run revision so it picks up the new value"
        required: true
        type: boolean
        default: true

env:
  PROJECT: sincere-cacao-514419-v5
  REGION: europe-north1
  SERVICE: bottega-api

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Show current env wiring
        run: |
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format=json | jq -r '.spec.template.spec.containers[0].env[]? | "\(.name): \(if .valueFrom then "secret " + .valueFrom.secretKeyRef.name + ":" + .valueFrom.secretKeyRef.key else "plain" end)"'

      - name: Add secret version
        env:
          NAME: ${{ inputs.name }}
          VALUE: ${{ secrets[inputs.name] }}
        run: |
          if [ -z "$VALUE" ]; then
            echo "GitHub secret $NAME is empty or missing" >&2
            exit 1
          fi
          if ! gcloud secrets describe "$NAME" --project "$PROJECT" >/dev/null 2>&1; then
            gcloud secrets create "$NAME" --project "$PROJECT" --replication-policy=automatic
          fi
          printf '%s' "$VALUE" | gcloud secrets versions add "$NAME" --project "$PROJECT" --data-file=-

      - name: Point service at latest version
        if: ${{ inputs.restart }}
        env:
          NAME: ${{ inputs.name }}
        run: |
          kind=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json \
            | jq -r --arg n "$NAME" '.spec.template.spec.containers[0].env[]? | select(.name == $n) | if .valueFrom then "secret" else "plain" end')
          # Plain env var must be removed before it can become a secret ref.
          extra=""
          if [ "$kind" = "plain" ]; then extra="--remove-env-vars=$NAME"; fi
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" \
            $extra --update-secrets="$NAME=$NAME:latest" --quiet
